apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: apps
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: workloads
    app.kubernetes.io/managed-by: argocd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
    # Le composant est discriminant : sans lui, les pods du Job de migration
    # (mêmes labels de nom) seraient ajoutés aux endpoints du Service et
    # recevraient du trafic HTTP qu'ils ne savent pas servir.
    app.kubernetes.io/component: http
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
