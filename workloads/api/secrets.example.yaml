# ---------------------------------------------------------------------------
# GABARIT — ce fichier n'est PAS déployé et ne contient aucun secret.
#
# Ce secret est consommé par l'API, par le worker et par le Job de migration :
# les trois partagent la même image et la même configuration.
#
# ATTENTION — DEUX duplications à maintenir :
#
# 1. DB_PASSWORD doit être identique au mot de passe du rôle `app` défini dans
#    data/postgres/credentials.enc.yaml. Les secrets Kubernetes ne traversent
#    pas les namespaces, donc la même valeur est chiffrée dans deux fichiers.
#    Les changer séparément casse l'accès à la base sans message clair : l'API
#    répond simplement 500.
#
# 2. METRICS_TOKEN doit être identique à la clé `token` de
#    observability/victoriametrics/metrics-token.enc.yaml, que vmagent monte
#    pour collecter /metrics. Les faire diverger donne un 404 sur /metrics, et
#    la cible bascule en `up == 0` — une panne de collecte qui ressemble à une
#    panne d'application.
#
# La rotation se fait toujours sur les deux fichiers à la fois.
#
# Procédure — le travail se fait EN PLACE sur le .enc.yaml, si bien qu'aucune
# copie en clair n'existe jamais sur le disque :
#
#   export EDITOR=nano                  # ou "code --wait"
#   # APP_KEY se génère hors cluster :
#   #   php artisan key:generate --show
#   # ou, sans PHP sous la main :
#   #   echo "base64:$(openssl rand -base64 32)"
#   cd workloads/api
#   cp secrets.example.yaml secrets.enc.yaml
#   sops encrypt --in-place secrets.enc.yaml
#   sops edit secrets.enc.yaml
#
# NE PAS faire `sops --encrypt fichier.yaml > fichier.enc.yaml` : le path_regex
# de .sops.yaml ne reconnaît que *.enc.yaml, et SOPS applique ses règles au
# chemin du fichier d'ENTRÉE.
#
# Changer APP_KEY invalide toutes les sessions et rend illisible tout ce que
# Laravel a chiffré en base. Ce n'est pas une rotation anodine.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: apps
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: workloads
    app.kubernetes.io/managed-by: argocd
type: Opaque
stringData:
  APP_KEY: base64:REMPLACER_PAR_LA_CLE_APPLICATIVE
  DB_USERNAME: app
  DB_PASSWORD: REMPLACER_IDENTIQUE_A_data/postgres/credentials.enc.yaml

  # Jeton de GET /metrics. `openssl rand -hex 32`.
  METRICS_TOKEN: REMPLACER_IDENTIQUE_A_observability/victoriametrics/metrics-token.enc.yaml

  # Connexion sociale. Les URL de retour sont dans le ConfigMap (elles ne sont
  # pas secrètes) et doivent être déclarées à l'identique dans les consoles :
  #   GitHub : Settings > Developer settings > OAuth Apps — aucun scope requis
  #   Google : console.cloud.google.com > Credentials — scopes `openid profile`
  GITHUB_CLIENT_ID: REMPLACER_PAR_L_ID_OAUTH_GITHUB
  GITHUB_CLIENT_SECRET: REMPLACER_PAR_LE_SECRET_OAUTH_GITHUB
  GOOGLE_CLIENT_ID: REMPLACER_PAR_L_ID_OAUTH_GOOGLE
  GOOGLE_CLIENT_SECRET: REMPLACER_PAR_LE_SECRET_OAUTH_GOOGLE
