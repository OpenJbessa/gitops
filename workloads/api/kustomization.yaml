apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

generators:
  - ./secret-generator.yaml

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - migrate-job.yaml
  - ingressroute.yaml
  - networkpolicy.yaml

# `envFrom.secretRef` référence le secret par un nom fixe : pas de suffixe.
generatorOptions:
  disableNameSuffixHash: true

# ---------------------------------------------------------------------------
# Tags des images — LE SEUL POINT QUE LA CI APPLICATIVE MODIFIE.
#
# Le dépôt applicatif ne parle jamais au cluster. Après avoir construit et signé
# les deux images, sa CI ouvre une pull request ICI :
#
#   cd workloads/api
#   kustomize edit set image \
#     ghcr.io/openjbessa/api=ghcr.io/openjbessa/api:sha-$GITHUB_SHA \
#     ghcr.io/openjbessa/api-nginx=ghcr.io/openjbessa/api-nginx:sha-$GITHUB_SHA
#
# LES DEUX TAGS AVANCENT ENSEMBLE. Une configuration nginx d'une version avec un
# PHP-FPM d'une autre n'est pas garantie compatible : refus de /metrics, format
# des journaux. Les deux images sont construites et signées par la même CI, ce
# qu'exige aussi la politique Kyverno de vérification des signatures.
#
# Pas d'annotation Renovate : un tag de SHA de commit n'a pas d'ordre que
# Renovate puisse comparer. C'est la CI applicative qui le fait avancer.
# ---------------------------------------------------------------------------
images:
  - name: ghcr.io/openjbessa/api
    newTag: sha-229b3ff192d7f54999fe32645e797a2eaabf7e76
  - name: ghcr.io/openjbessa/api-nginx
    newTag: sha-229b3ff192d7f54999fe32645e797a2eaabf7e76
