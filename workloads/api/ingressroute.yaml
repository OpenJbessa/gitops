apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api
  namespace: apps
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: workloads
    app.kubernetes.io/managed-by: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`api.jbessa.tech`)
      services:
        - name: api
          port: 8080
  # Aucun secret précisé : Traefik sert le certificat wildcard du TLSStore
  # `default` (platform/traefik/tlsstore.yaml). C'est ce qui évite une émission
  # ACME par sous-domaine.
  tls: {}
