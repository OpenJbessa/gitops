apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api
  namespace: apps
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: workloads
    app.kubernetes.io/managed-by: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      # /metrics est exclu de la route publique. C'est la première de trois
      # barrières, et la seule qui coupe le trafic avant d'entrer dans le pod :
      # nginx répond 404 à toute requête /metrics portant X-Forwarded-For (donc
      # passée par Traefik), et l'application exige un jeton Bearer.
      #
      # vmagent atteint /metrics en visant le pod directement, sans passer par
      # Traefik : cette exclusion ne le gêne pas.
      match: Host(`api.jbessa.tech`) && !Path(`/metrics`)
      services:
        - name: api
          port: 8080
  # Aucun secret précisé : Traefik sert le certificat wildcard du TLSStore
  # `default` (platform/traefik/tlsstore.yaml). C'est ce qui évite une émission
  # ACME par sous-domaine.
  tls: {}
