apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

resources:
  - deployment.yaml
  - scaledobject.yaml
  - networkpolicy.yaml
  # Générateur d'événements et purge. Même Application, même image, même tag
  # que le consommateur : les deux forment la séquence que KEDA observe.
  - emitter.yaml
  - emitter-networkpolicy.yaml

# Même image que l'API : le worker n'est que la même base de code lancée avec
# une autre commande. Les deux tags doivent donc avancer ensemble, et la CI
# applicative met à jour les deux kustomization.yaml dans la même pull request.
images:
  - name: ghcr.io/openjbessa/api
    newTag: sha-229b3ff192d7f54999fe32645e797a2eaabf7e76
