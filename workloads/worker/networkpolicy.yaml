# Le worker n'expose rien : personne ne l'appelle. Seules ses sorties comptent.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker
  namespace: apps
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: workloads
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
      ports:
        # Redis seulement. Le port 5432 a été retiré : le consommateur de
        # stream ne touche plus la base — c'est le générateur qui porte la
        # purge, et il a sa propre policy (emitter-networkpolicy.yaml).
        - protocol: TCP
          port: 6379
