# ---------------------------------------------------------------------------
# Autoscaling du consommateur sur le retard du stream Redis.
#
# LE PLAFOND DE 4 N'EST PAS UN CHIFFRE ROND, IL DÉCOULE DU BUDGET MÉMOIRE :
#   4 réplicas × 128 Mo de request = 512 Mo
#   moins le réplica permanent déjà compté au repos = +384 Mo au pic
#
# Le total de la plateforme n'est pas recopié ici : il a déjà été faux deux
# fois. La seule source de vérité est `scripts/check-budget.py`, qui le calcule
# sur les manifests rendus et refuse de dépasser 4 600 Mo :
#
#   python3 scripts/render.py --out /tmp/rendered
#   python3 scripts/check-budget.py --manifests /tmp/rendered
#
# Le script affiche la ligne « Au pic » en tenant compte de ce maxReplicaCount.
# Passer à 5 ferait sortir la plateforme de son enveloppe et mettrait le nœud en
# pression mémoire — c'est-à-dire en éviction, probablement de PostgreSQL, qui
# est la plus grosse charge du cluster. Ce plafond est une contrainte physique,
# pas un réglage de confort, et la CI le fait respecter.
# ---------------------------------------------------------------------------
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
  namespace: apps
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: workloads
    app.kubernetes.io/managed-by: argocd
spec:
  scaleTargetRef:
    name: worker

  # Jamais zéro : un consommateur à froid doit recharger tout le conteneur PHP
  # avant de traiter son premier lot. Garder un réplica permanent coûte 128 Mo
  # et supprime cette latence de démarrage.
  minReplicaCount: 1
  maxReplicaCount: 4

  # 5 s et non 15. Pendant une rafale le retard croît de 100 entrées par seconde
  # (150 émises, 50 traitées par un consommateur) : chaque tranche de 10 s de
  # retard de détection coûte 1 000 entrées sur un MAXLEN de 10 000.
  pollingInterval: 5

  # Sans effet tant que minReplicaCount vaut 1 : cooldownPeriod ne gouverne que
  # le retour à zéro réplica. La descente réelle est réglée par le
  # stabilizationWindowSeconds de scaleDown ci-dessous.
  cooldownPeriod: 300

  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            # De 1 à 4 en UNE étape. L'ancienne politique (+2 pods par minute)
            # bloquait à 3 consommateurs pendant toute la rafale de 60 s : la
            # montée arrivait après la fin de ce qu'elle devait absorber.
            - type: Pods
              value: 4
              periodSeconds: 5
        scaleDown:
          # Deux minutes d'inertie, puis un pod toutes les 30 s : retour à un
          # réplica environ 3 min 30 après que le retard est retombé. Chaque
          # cycle de descente-remontée coûte un démarrage de conteneur complet.
          stabilizationWindowSeconds: 120
          policies:
            - type: Pods
              value: 1
              periodSeconds: 30

  triggers:
    - type: redis-streams
      metadata:
        address: redis.data.svc.cluster.local:6379
        # Le stream et le groupe. REDIS_PREFIX est fixé à une chaîne vide dans
        # le ConfigMap de l'API pour que ce nom soit prévisible : sans ça,
        # Laravel préfixe d'après APP_NAME et KEDA observerait une clé
        # inexistante — le consommateur resterait à un réplica sans le moindre
        # message d'erreur.
        stream: demo:events
        consumerGroup: workers

        # -------------------------------------------------------------------
        # `lagCount` : un réplica par tranche de 500 entrées de RETARD.
        #
        # Support vérifié dans la source du scaler de la version déployée —
        # kedacore/keda v2.20.2, commit 68a5b502, chart épinglé dans
        # apps/platform/keda.yaml — fichier pkg/scalers/redis_streams_scaler.go :
        #
        #   l. 29   lagMetadata = "lagCount"
        #   l. 54   TargetLag int64 `keda:"name=lagCount, order=triggerMetadata, optional"`
        #   l. 83   r.scaleFactor = lagFactor   -- choisi dès que consumerGroup
        #           est renseigné ET lagCount non nul ; TargetPendingEntriesCount
        #           est alors remis à zéro, les deux modes ne coexistent pas.
        #   l. 250  return group.Lag            -- le champ `lag` de XINFO GROUPS
        #
        # La vérification s'est faite sur la source et non sur le cluster, faute
        # d'accès (certificat Teleport expiré, MFA interactive). C'est en
        # l'occurrence la meilleure preuve : `kubectl explain
        # scaledobject.spec.triggers` n'aurait rien dit, les métadonnées d'un
        # déclencheur étant une map[string]string non typée dans la CRD.
        #
        # PRÉREQUIS REDIS 7. Le scaler lit `redis_version` avant tout appel et
        # refuse en dessous de 7 (l. 225, « redis version 7+ required for lag ») :
        # le champ `lag` de XINFO GROUPS n'existe pas avant. `data/redis` épingle
        # redis:8.8.2-alpine, la condition est donc largement tenue. Seule une
        # rétrogradation majeure la casserait, et elle échouerait bruyamment —
        # le scaler renvoie une erreur, il ne retombe pas silencieusement sur
        # un autre mode.
        #
        # POURQUOI PAS LES DEUX AUTRES MODES :
        #   - `pendingEntriesCount` ne compte que les entrées DISTRIBUÉES et non
        #     acquittées. Un consommateur ne réclame que ce qu'il peut traiter :
        #     ce nombre reste proche d'un lot même avec des milliers d'entrées en
        #     attente, et la montée en charge ne se déclencherait jamais.
        #   - `streamLength` compte les entrées PRÉSENTES, acquittées comprises.
        #     Avec MAXLEN à 10 000, le stream reste plein une fois tout traité :
        #     le déclencheur resterait coincé au plafond en permanence.
        # -------------------------------------------------------------------
        lagCount: "500"
        # Pas d'`activationLagCount` : il ne sert qu'à sortir de zéro réplica, et
        # minReplicaCount vaut 1. Le laisser à son défaut (0) est sans effet ici.

        databaseIndex: "0"
        enableTLS: "false"
