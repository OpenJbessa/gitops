# ---------------------------------------------------------------------------
# Front Nuxt — un seul réplica.
# Budget : 256 Mo de request, 384 Mo de limite.
#
# Même durcissement que l'API, mais plus simple : ni base, ni file, ni
# migration. Le front n'a besoin d'aucun volume inscriptible — Nuxt sert un
# build statique et ne touche pas au disque à l'exécution.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: apps
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: workloads
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  # Même raison que l'API : pas de cohabitation de deux pods sur un nœud dont
  # la mémoire est la ressource contrainte.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: workloads
        app.kubernetes.io/managed-by: argocd
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/openjbessa/web:placeholder
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            - name: NODE_ENV
              value: production
            - name: NUXT_PUBLIC_API_BASE
              value: https://api.jbessa.tech
            - name: PORT
              value: "3000"
            - name: HOST
              value: 0.0.0.0
            # Plafonne le tas V8 sous la limite du conteneur. Sans cela, Node
            # dimensionne son tas d'après la mémoire de l'HÔTE — 8 Go — et se
            # fait tuer par l'OOM killer avant d'avoir déclenché son propre GC.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=320"

          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 384Mi

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

      terminationGracePeriodSeconds: 30
