# ---------------------------------------------------------------------------
# Validation du dépôt gitops.
#
# Ce pipeline ne déploie RIEN et ne détient aucun identifiant de cluster. Le
# modèle reste strictement pull : ArgoCD va chercher son état, la CI se contente
# de refuser ce qui ne tient pas debout. Ajouter un chemin de déploiement par
# push créerait une seconde source de vérité.
#
# `permissions: contents: read` et aucun secret : les pull requests venant d'un
# fork s'exécutent sans rien pouvoir exfiltrer. C'est indispensable sur un dépôt
# public.
# ---------------------------------------------------------------------------
name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Sert à résoudre l'image du repo-server et l'appVersion du chart kyverno.
  # Ce n'est PAS le helm qui rend le dépôt : celui-là est dans l'image ArgoCD,
  # et c'est tout l'objet de la tâche render-argocd.
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v3.16.4
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: v0.6.7
  # Sert à la tâche render-argocd, qui chiffre des secrets factices pour une clé
  # age jetable. Aligné sur la version demandée au poste par le README.
  # renovate: datasource=github-releases depName=getsops/sops
  SOPS_VERSION: v3.9.4
  # DOIT correspondre à l'appVersion du chart kyverno déployé. La tâche
  # `policies` le vérifie et échoue si les deux divergent.
  # renovate: datasource=github-releases depName=kyverno/kyverno
  KYVERNO_VERSION: v1.19.1

jobs:
  # -------------------------------------------------------------------------
  # Le contrôle le plus important, et le plus rapide : il tourne en premier et
  # sans dépendance, pour que l'échec arrive en quelques secondes.
  # -------------------------------------------------------------------------
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aucun secret exposé
        run: bash scripts/check-secrets.sh

  # -------------------------------------------------------------------------
  # UN SEUL RENDU, celui du repo-server.
  #
  # Il y en avait deux : une tâche `render` avec le helm du runner (v3.16) et
  # celle-ci avec celui de l'image ArgoCD (v4.2). kubeconform validait la sortie
  # de la première — donc des manifests qui n'étaient déployés nulle part. Les
  # deux rendus ont été fusionnés sur celui qui fait foi.
  #
  # `scripts/render.py` reste le chemin rapide pour itérer sur le poste, et
  # garde la découverte des Applications : `--plan` la livre à ce script, qui
  # l'exécute dans l'image. La logique n'est écrite qu'une fois.
  #
  # AUCUN SECRET. Une clé age jetable est générée à chaque exécution et des
  # secrets factices sont fabriqués depuis les gabarits `*.example.yaml`. La
  # vraie clé n'existe nulle part dans cette CI, qui tourne sans identifiant et
  # sur des pull requests venant de forks. Effet de bord utile : les trois
  # Applications qui exigeaient un secret SOPS, et qui n'étaient donc rendues
  # ni validées nulle part, le sont ici.
  #
  # Cette tâche DOIT être un contrôle requis de la protection de branche : c'est
  # elle qui garde les montées de version d'ArgoCD, de KSOPS et de Helm.
  # -------------------------------------------------------------------------
  render-argocd:
    name: rendu par le repo-server et schémas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml

      - name: Installer age, sops et kubeconform
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          # Le tag porte le préfixe `v`, pas le nom de l'actif : v3.9.4 ->
          # sops_3.9.4_amd64.deb. C'est la même URL que celle du README.
          curl -fsSLo /tmp/sops.deb \
            "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops_${SOPS_VERSION#v}_amd64.deb"
          sudo dpkg -i /tmp/sops.deb
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform

      - name: Rendre le dépôt avec la chaîne d'outils du repo-server, puis valider
        run: bash scripts/render-argocd.sh "$RUNNER_TEMP/rendered"

      - name: Conserver le rendu pour la tâche budget
        uses: actions/upload-artifact@v4
        with:
          name: rendered
          path: ${{ runner.temp }}/rendered
          retention-days: 3

  # -------------------------------------------------------------------------
  # Une clé de valeurs mal placée ne produit aucune erreur Helm : elle est
  # ignorée, et le pod part sans limite mémoire. Sur un nœud de 8 Go, c'est ce
  # qui finit en éviction de PostgreSQL. D'où ce contrôle.
  # -------------------------------------------------------------------------
  budget:
    name: budget mémoire
    runs-on: ubuntu-latest
    needs: render-argocd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - uses: actions/download-artifact@v4
        with:
          name: rendered
          path: ${{ runner.temp }}/rendered
      - name: Réservation mémoire sous le plafond
        run: python3 scripts/check-budget.py --manifests "$RUNNER_TEMP/rendered"

  # -------------------------------------------------------------------------
  # Les versions doivent rester épinglées : une plage ou un `latest` rendrait
  # le dépôt non reproductible, et le cluster dériverait sans qu'un commit le
  # dise.
  # -------------------------------------------------------------------------
  pinning:
    name: versions épinglées
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Aucune version flottante
        run: |
          python3 - <<'PY'
          import pathlib, re, sys, yaml
          echec = []

          # Versions de charts dans les Applications
          for f in sorted(pathlib.Path("apps").rglob("*.yaml")):
              for d in yaml.safe_load_all(f.read_text()):
                  if not isinstance(d, dict) or d.get("kind") != "Application":
                      continue
                  spec = d["spec"]
                  for s in spec.get("sources") or [spec.get("source", {})]:
                      if "chart" not in s:
                          continue
                      v = str(s.get("targetRevision", ""))
                      if not re.fullmatch(r"v?\d+\.\d+\.\d+", v):
                          echec.append(f"{f}: {s['chart']} -> '{v}' n'est pas une version exacte")

          # Versions de charts inflatés par kustomize (helmCharts:). Teleport y
          # est passé pour pouvoir patcher un initContainer codé en dur dans le
          # chart ; sans ce bloc, sa version sortait du contrôle d'épinglage en
          # même temps qu'elle sortait de spec.sources[].chart.
          for f in sorted(pathlib.Path(".").rglob("kustomization.yaml")):
              # `charts/` contient les charts téléchargés par le générateur
              # helmCharts, avec leurs propres kustomizations d'exemple. Ils ne
              # sont pas du dépôt et ne sont jamais committés (cf. .gitignore).
              if "charts" in f.parts:
                  continue
              d = yaml.safe_load(f.read_text())
              if not isinstance(d, dict):
                  continue
              for c in d.get("helmCharts") or []:
                  v = str(c.get("version", ""))
                  if not re.fullmatch(r"v?\d+\.\d+\.\d+", v):
                      echec.append(f"{f}: {c.get('name')} -> '{v}' n'est pas une version exacte")

          # Clés dupliquées dans le workflow lui-même. `yaml.safe_load` les
          # avale — la dernière gagne — et un job entier peut ainsi être masqué
          # par un homonyme sans que rien ne le signale. Les manifests rendus
          # sont couverts par `kubeconform -strict`, ce fichier ne l'est par
          # personne.
          class Strict(yaml.SafeLoader):
              pass

          def sans_doublon(loader, node, deep=False):
              vus = {}
              for cle_n, val_n in node.value:
                  cle = loader.construct_object(cle_n, deep=deep)
                  if cle in vus:
                      echec.append(
                          f".github/workflows/validate.yml: clé dupliquée '{cle}' "
                          f"ligne {cle_n.start_mark.line + 1}"
                      )
                  vus[cle] = loader.construct_object(val_n, deep=deep)
              return vus

          Strict.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, sans_doublon
          )
          yaml.load(pathlib.Path(".github/workflows/validate.yml").read_text(), Strict)

          # Versions d'outils du workflow lui-même. La CLI Kyverno y a échappé
          # longtemps : sa version était enterrée dans une commande curl, pas
          # déclarée en env comme Helm ou kubeconform, et personne ne l'a vue
          # partir à la dérive de la version déployée.
          wf = yaml.safe_load(pathlib.Path(".github/workflows/validate.yml").read_text())
          for cle, v in (wf.get("env") or {}).items():
              if not cle.endswith("_VERSION"):
                  continue
              if not re.fullmatch(r"v?\d+\.\d+\.\d+", str(v)):
                  echec.append(f"validate.yml: {cle} -> '{v}' n'est pas une version exacte")
          # Et aucune version ne doit être écrite en dur dans un `run:` : c'est
          # exactement ainsi que la CLI Kyverno a divergé.
          for nom, job in (wf.get("jobs") or {}).items():
              for etape in job.get("steps") or []:
                  for n, ligne in enumerate((etape.get("run") or "").splitlines(), 1):
                      m = re.search(r"releases/download/(v?\d+\.\d+\.\d+)/", ligne)
                      if m:
                          echec.append(
                              f"validate.yml: job {nom}: version {m.group(1)} codée en dur "
                              f"dans un run:, la déclarer en env comme les autres"
                          )

          # Le catalogue de schémas CRD décide d'un échec de la CI au même titre
          # qu'un chart : il est épinglé à un commit, jamais à une branche. Une
          # référence flottante rendrait le verdict de `render-argocd` variable
          # à dépôt inchangé — et le plus dangereux n'est pas qu'il rougisse,
          # c'est qu'un schéma assoupli en amont laisse passer ce qu'il refusait.
          for f in sorted(pathlib.Path("scripts").rglob("*")):
              if not f.is_file():
                  continue
              texte = f.read_text(errors="ignore")
              lignes = texte.splitlines()
              # La référence peut être écrite en clair ou passer par une variable
              # shell ; les deux formes doivent aboutir à un SHA de commit.
              a_verifier = set()
              for n, ligne in enumerate(lignes, 1):
                  for m in re.finditer(
                      r"raw\.githubusercontent\.com/[\w.-]+/[\w.-]+/([^/\s\"']+)", ligne
                  ):
                      ref = m.group(1)
                      if re.fullmatch(r"[0-9a-f]{40}", ref):
                          continue
                      var = re.fullmatch(r"\$\{?(\w+)\}?", ref)
                      if var:
                          a_verifier.add(var.group(1))
                          continue
                      echec.append(
                          f"{f}:{n}: schéma tiré de la référence '{ref}' — "
                          f"épingler un SHA de commit, une branche rendrait le "
                          f"verdict de la CI variable à dépôt inchangé"
                      )
              # Chaque variable ainsi employée doit valoir un SHA, et porter une
              # annotation Renovate — sans quoi elle serait épinglée pour de bon,
              # ce qui n'est pas mieux qu'une branche.
              for nom in sorted(a_verifier):
                  m = re.search(rf'^\s*{nom}="([^"]*)"\s*$', texte, re.M)
                  if not m:
                      echec.append(f"{f}: {nom} employée comme référence mais jamais affectée")
                      continue
                  if not re.fullmatch(r"[0-9a-f]{40}", m.group(1)):
                      echec.append(
                          f"{f}: {nom} vaut '{m.group(1)}' — ce n'est pas un SHA de commit"
                      )
                      continue
                  avant = texte[:m.start()].splitlines()
                  if not (avant and "renovate:" in avant[-1]):
                      echec.append(
                          f"{f}: {nom} n'a pas d'annotation `# renovate:` juste "
                          f"au-dessus : le SHA ne serait jamais mis à jour"
                      )

          # Tags d'images dans les manifests
          for base in ("platform", "data", "workloads", "observability", "bootstrap"):
              for f in sorted(pathlib.Path(base).rglob("*.yaml")):
                  # Même raison que ci-dessus : le contenu d'un chart amont
                  # n'est pas à épingler par ce dépôt, et ses gabarits Helm ne
                  # sont de toute façon pas du YAML à analyser.
                  if "charts" in f.parts:
                      continue
                  for n, ligne in enumerate(f.read_text().splitlines(), 1):
                      m = re.search(r'^\s*(?:-\s+)?image:\s*["\']?([^\s"\']+)', ligne)
                      if not m:
                          continue
                      ref = m.group(1)
                      if ref.endswith(":placeholder"):   # remplacé par kustomize
                          continue
                      if ":" not in ref.rsplit("/", 1)[-1] or ref.endswith(":latest"):
                          echec.append(f"{f}:{n}: image non épinglée -> {ref}")

          if echec:
              print("\n".join("  " + e for e in echec))
              sys.exit(1)
          print("  Toutes les versions de charts et d'images sont épinglées.")
          PY

  # -------------------------------------------------------------------------
  # Les policies Kyverno sont le seul composant du dépôt qui peut refuser un
  # déploiement. Une policy syntaxiquement invalide passerait inaperçue jusqu'à
  # ce qu'elle laisse tout passer.
  # -------------------------------------------------------------------------
  policies:
    name: policies kyverno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml

      # La CLI doit parler la même version que le Kyverno déployé : une policy
      # acceptée par une CLI plus récente que le cluster passerait la CI et
      # serait refusée à l'admission. Le lien n'est pas déclaratif — on le
      # vérifie, on ne le suppose pas.
      - name: La CLI correspond au Kyverno déployé
        run: |
          CHART=$(python3 - <<'PY'
          import pathlib, yaml
          for d in yaml.safe_load_all(pathlib.Path("apps/platform/kyverno.yaml").read_text()):
              if not isinstance(d, dict) or d.get("kind") != "Application":
                  continue
              spec = d["spec"]
              for s in spec.get("sources") or [spec.get("source", {})]:
                  if s.get("chart") == "kyverno":
                      print(s["targetRevision"]); raise SystemExit
          raise SystemExit("chart kyverno introuvable")
          PY
          )
          helm repo add kyverno https://kyverno.github.io/kyverno >/dev/null
          helm repo update kyverno >/dev/null
          DEPLOYE=$(helm show chart kyverno/kyverno --version "$CHART" | awk '/^appVersion:/ {print $2}')
          echo "  chart kyverno $CHART -> Kyverno $DEPLOYE"
          echo "  KYVERNO_VERSION du workflow : $KYVERNO_VERSION"
          if [ "$DEPLOYE" != "$KYVERNO_VERSION" ]; then
            echo "  ÉCHEC : la CLI est épinglée à $KYVERNO_VERSION, le cluster déploie $DEPLOYE."
            echo "  Aligner KYVERNO_VERSION dans .github/workflows/validate.yml."
            exit 1
          fi

      - name: Installer la CLI Kyverno
        run: |
          curl -fsSL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kyverno

      # `kyverno validate` n'existe plus : la sous-commande a disparu de la CLI,
      # et cette tâche échouait sur « unknown command validate » depuis assez
      # longtemps pour qu'on l'oublie. `kyverno test` la remplace, et éprouve un
      # comportement plutôt qu'une syntaxe — ce que la policy refuse et ce
      # qu'elle laisse passer. Voir platform/kyverno/tests/kyverno-test.yaml
      # pour ce qui est couvert, et ce qui ne peut pas l'être hors ligne.
      - name: Les policies refusent et acceptent ce qu'il faut
        run: kyverno test platform/kyverno/tests

  # -------------------------------------------------------------------------
  renovate:
    name: configuration renovate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes --package renovate -- renovate-config-validator --strict
