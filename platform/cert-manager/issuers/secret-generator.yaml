# Générateur KSOPS : kustomize invoque le binaire `ksops` (installé dans le
# repo-server par l'initContainer, cf. bootstrap/argocd-values.yaml), qui
# déchiffre le fichier listé et le rend comme un Secret ordinaire.
# Le contenu déchiffré ne touche jamais le disque : il reste dans le flux
# stdout du plugin.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: cloudflare-api-token-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./cloudflare-token.enc.yaml
