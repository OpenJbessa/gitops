apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generators:
  - ./secret-generator.yaml

resources:
  - clusterissuer.yaml
  - certificates.yaml

# Empêche kustomize de suffixer le nom du Secret par un hash : le ClusterIssuer
# le référence par un nom fixe, et un suffixe rendrait la référence invalide.
generatorOptions:
  disableNameSuffixHash: true
