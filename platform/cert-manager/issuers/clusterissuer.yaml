# ---------------------------------------------------------------------------
# Émetteurs Let's Encrypt, challenge DNS-01 via Cloudflare.
#
# Pourquoi DNS-01 et pas HTTP-01 :
#   - c'est le seul challenge qui permette d'obtenir un wildcard, et un
#     wildcard unique évite une émission par sous-domaine ;
#   - il ne dépend pas de l'accessibilité HTTP du cluster, donc il fonctionne
#     avant même que Traefik soit opérationnel ;
#   - Teleport termine son propre TLS et ne peut pas servir un challenge HTTP.
#
# Deux émetteurs sont déclarés. Le staging n'a pas de limite de débit utile :
# c'est celui qu'on met dans un Certificate le temps de valider une chaîne
# d'émission, avant de basculer sur la production. Les certificats de staging
# ne sont pas reconnus par les navigateurs, c'est normal.
# ---------------------------------------------------------------------------
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/name: letsencrypt-prod
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: argocd
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: jonathan@jbessa.tech
    # Clé de compte ACME générée au premier usage. Ne pas la supprimer : la
    # recréer réinitialise le quota d'émission associé au compte.
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        # Restreint ce solveur à la seule zone gérée : une erreur de nom de
        # domaine dans un Certificate échoue au lieu de partir en boucle ACME.
        selector:
          dnsZones:
            - jbessa.tech
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/name: letsencrypt-staging
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: argocd
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: jonathan@jbessa.tech
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - jbessa.tech
