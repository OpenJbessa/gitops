# ---------------------------------------------------------------------------
# Entrée Teleport — passthrough TCP, pas de terminaison TLS côté Traefik.
#
# Teleport multiplexe plusieurs protocoles sur le port 443 en s'appuyant sur
# l'extension ALPN de TLS : c'est lui qui, après la poignée de main, décide si
# la connexion est du HTTP, du SSH ou du proxy Kubernetes. Si Traefik terminait
# le TLS, cette information disparaîtrait et `tsh` cesserait de fonctionner.
#
# D'où un IngressRouteTCP qui route sur le seul SNI, sans jamais déchiffrer.
# C'est aussi la raison pour laquelle teleport.jbessa.tech doit rester en
# « DNS only » côté Cloudflare : le proxy Cloudflare réécrit la session TLS.
# ---------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: teleport
  namespace: teleport
  annotations:
    # Après le chart, pour que le Service existe.
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: teleport
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: argocd
spec:
  entryPoints:
    - websecure
  routes:
    # Teleport multiplexe TOUS ses services sur le 443 et les distingue par le
    # SNI. Le navigateur n'utilise que le premier ; tout client natif — tsh,
    # Teleport Connect, kubectl — en utilise d'autres.
    #
    # Les familles observées sur ce cluster :
    #   teleport.jbessa.tech                                    connexion initiale
    #   kube-teleport-proxy-alpn.teleport.jbessa.tech           accès Kubernetes
    #   <hex>.teleport.cluster.local                            routage ALPN interne
    #     (<hex> est le nom du cluster encodé :
    #      teleport.jbessa.tech -> 74656c65706f72742e6a62657373612e74656368)
    #
    # Tout SNI non capté ici retombe sur le routeur HTTP par défaut, et Traefik
    # répond avec le certificat wildcard. Le client échoue alors sur :
    #   « certificate is valid for *.jbessa.tech, not <le SNI attendu> »
    # Un wildcard ne couvrant qu'un seul niveau, il ne peut de toute façon pas
    # valider un nom à deux niveaux comme kube-teleport-proxy-alpn.teleport.…
    #
    # D'où une expression générale plutôt qu'une énumération : Teleport ajoute
    # des préfixes de service au fil des versions, et chaque oubli se manifeste
    # par un client cassé pendant que le navigateur continue de fonctionner.
    - match: HostSNI(`teleport.jbessa.tech`) || HostSNIRegexp(`^.+\.teleport\.(jbessa\.tech|cluster\.local)$`)
      services:
        - name: teleport
          port: 443
  tls:
    passthrough: true
