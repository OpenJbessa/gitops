# Wave 6 — évaluation des règles d'alerte, avec Alertmanager en sous-chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vmalert
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  labels:
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/OpenJbessa/gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://victoriametrics.github.io/helm-charts
      chart: victoria-metrics-alert
      targetRevision: 0.48.0
      helm:
        releaseName: vmalert
        valueFiles:
          - $values/observability/victoriametrics/alert-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 3
