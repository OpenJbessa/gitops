# Wave 6 — Grafana, accès authentifié.
#
# Troisième source : la ConfigMap du tableau de bord, construite par kustomize
# à partir du JSON versionné, l'IngressRoute, et le secret SOPS du compte admin.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/OpenJbessa/gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://grafana.github.io/helm-charts
      chart: grafana
      targetRevision: 10.5.15
      helm:
        # Cf. apps/platform/teleport.yaml : les Jobs de test bloquent la synchronisation.
        skipTests: true
        releaseName: grafana
        valueFiles:
          - $values/observability/grafana/values.yaml
    - repoURL: https://github.com/OpenJbessa/gitops.git
      targetRevision: main
      path: observability/grafana
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
  # Plus d'ignoreDifferences sur le secret `grafana` : avec
  # `admin.existingSecret`, le chart ne rend plus ce secret du tout — il lit
  # `grafana-admin`, produit par KSOPS et donc stable par construction. La règle
  # ne masquait rien d'autre, et le secret généré d'origine sera élagué à la
  # prochaine synchronisation.
  revisionHistoryLimit: 3
