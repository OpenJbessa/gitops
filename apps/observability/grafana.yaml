# Wave 6 — Grafana, accès anonyme en lecture.
#
# Troisième source : la ConfigMap du tableau de bord, construite par kustomize
# à partir du JSON versionné, et l'IngressRoute.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/OpenJbessa/gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://grafana.github.io/helm-charts
      chart: grafana
      targetRevision: 10.5.15
      helm:
        releaseName: grafana
        valueFiles:
          - $values/observability/grafana/values.yaml
    - repoURL: https://github.com/OpenJbessa/gitops.git
      targetRevision: main
      path: observability/grafana
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    # Le mot de passe admin est généré par le chart au premier déploiement et
    # ne doit pas être régénéré à chaque synchronisation.
    - group: ""
      kind: Secret
      name: grafana
      jsonPointers:
        - /data
  revisionHistoryLimit: 3
