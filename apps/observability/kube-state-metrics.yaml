# Wave 6 — état des objets Kubernetes.
#
# Composant ajouté hors table de budget : c'est la seule source de
# kube_pod_container_status_waiting_reason (alerte CrashLoopBackOff) et de
# kube_deployment_status_replicas (panneau « réplicas worker »). Voir l'en-tête
# de observability/kube-state-metrics/values.yaml pour le détail.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-state-metrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/OpenJbessa/gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-state-metrics
      targetRevision: 8.5.0
      helm:
        # Cf. apps/platform/teleport.yaml : les Jobs de test bloquent la synchronisation.
        skipTests: true
        releaseName: ksm
        valueFiles:
          - $values/observability/kube-state-metrics/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 3
