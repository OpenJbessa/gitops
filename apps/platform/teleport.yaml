# Wave 3 — Teleport Community Edition, instance unique.
#
# Dépend de la wave 2 pour son certificat : le secret `teleport-tls` est émis
# par cert-manager en DNS-01 et monté dans le pod proxy, qui termine lui-même
# le TLS. Traefik ne fait que du passthrough TCP par SNI (cf. la troisième
# source ci-dessous).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: teleport
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: teleport
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # Source unique, contrairement à toutes les autres Applications du dépôt.
  #
  # Le chart teleport-cluster n'est pas tiré par ArgoCD mais inflaté par
  # kustomize depuis `platform/teleport/kustomization.yaml`, qui l'épingle en
  # 18.10.0 et lui passe `values.yaml`. La raison tient en une phrase : une
  # source Helm et une source kustomize sont rendues indépendamment puis
  # concaténées, donc la seconde ne peut pas patcher la première — et il faut
  # patcher l'initContainer `wait-auth-update`, dont les 256 Mo de requête sont
  # codés en dur dans le chart. Le détail est dans la kustomization.
  #
  # Ce répertoire porte donc à la fois le chart, l'IngressRouteTCP en
  # passthrough, la purge des enregistrements et le rôle platform-admin.
  source:
    repoURL: https://github.com/OpenJbessa/gitops.git
    targetRevision: main
    path: platform/teleport

  destination:
    server: https://kubernetes.default.svc
    namespace: teleport

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m

  ignoreDifferences:
    # Le PVC SQLite ne doit jamais être recréé par une resynchronisation :
    # il contient l'intégralité de l'état Teleport (utilisateurs, certificats
    # d'hôte, jetons). Sa taille est immuable côté Kubernetes de toute façon.
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/resources/requests/storage
        - /status

  revisionHistoryLimit: 3
