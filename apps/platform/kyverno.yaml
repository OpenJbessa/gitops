# Wave 3 — Kyverno en contrôleur d'admission, avec ses policies.
#
# Les ClusterPolicy sont dans la MÊME Application que le chart, et non dans une
# Application séparée : Kyverno valide ses propres policies via un webhook en
# failurePolicy=Fail. Soumettre une ClusterPolicy pendant que le contrôleur
# démarre fait échouer l'apply. La sync-wave interne (annotation sur les
# ClusterPolicy, cf. platform/kyverno/policies/) résout l'ordre : ArgoCD attend
# que le Deployment du chart soit Healthy avant de passer aux policies.
#
# Conséquence assumée : à partir de cette wave, tout pod déployé doit satisfaire
# les policies. Les waves 4 à 7 sont donc les premières réellement contrôlées.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: https://github.com/OpenJbessa/gitops.git
      targetRevision: main
      ref: values

    - repoURL: https://kyverno.github.io/kyverno
      chart: kyverno
      targetRevision: 3.9.1
      helm:
        # Cf. apps/platform/teleport.yaml : les Jobs de test bloquent la synchronisation.
        skipTests: true
        releaseName: kyverno
        valueFiles:
          - $values/platform/kyverno/values.yaml

    - repoURL: https://github.com/OpenJbessa/gitops.git
      targetRevision: main
      path: platform/kyverno/policies

  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Les CRD de Kyverno figurent parmi les plus grosses de l'écosystème.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m

  ignoreDifferences:
    # Kyverno auto-injecte son caBundle dans ses propres webhooks.
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    # Le statut d'une policy contient le compteur d'évaluations, qui bouge en
    # permanence.
    - group: kyverno.io
      kind: ClusterPolicy
      jsonPointers:
        - /status

  revisionHistoryLimit: 3
