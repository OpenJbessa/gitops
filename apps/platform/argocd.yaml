# Wave 0 — ArgoCD reprend la main sur sa propre configuration.
#
# Le fichier de valeurs référencé ici est EXACTEMENT celui utilisé par le
# `helm install` d'amorçage. Au premier passage, le diff est donc vide et aucun
# pod ne redémarre : ArgoCD se contente d'adopter ce qui tourne déjà.
# Après ça, toute modification de sa configuration passe par une pull request.
#
# Piège à éviter : si `targetRevision` ci-dessous diverge de la version passée
# au helm install, ArgoCD redéploiera ArgoCD pendant la synchronisation
# initiale — au milieu de la synchronisation initiale. Les deux doivent coïncider.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    # Source de valeurs uniquement : pas de `path`, donc rien n'est rendu ici.
    - repoURL: https://github.com/OpenJbessa/gitops.git
      targetRevision: main
      ref: values

    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.9.1
      helm:
        releaseName: argocd
        valueFiles:
          - $values/bootstrap/argocd-values.yaml

    # Manifests bruts complétant le chart (exposition HTTP notamment).
    - repoURL: https://github.com/OpenJbessa/gitops.git
      targetRevision: main
      path: platform/argocd

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      # Les CRD d'ArgoCD dépassent la limite des 262 ko d'annotation de
      # last-applied-configuration : l'apply côté client échouerait.
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m

  ignoreDifferences:
    # cert-manager n'est pas encore là au moment où ArgoCD s'adopte, mais si un
    # jour un webhook injecte un caBundle dans ces CRD, on ne veut pas boucler.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
    # Le secret admin est généré au premier démarrage et tourné hors Git.
    - group: ""
      kind: Secret
      name: argocd-secret
      jsonPointers:
        - /data

  revisionHistoryLimit: 3
