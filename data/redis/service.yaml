apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: data
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: data
    app.kubernetes.io/managed-by: argocd
spec:
  # Headless : un seul pod, dont l'adresse est résolue directement. Évite un
  # saut de traduction d'adresse inutile pour un service à instance unique, et
  # sert aussi de service de gouvernance au StatefulSet.
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
