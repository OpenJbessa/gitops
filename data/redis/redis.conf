# ---------------------------------------------------------------------------
# Configuration Redis.
#
# Usage mixte : cache et sessions Laravel d'un côté, streams de file de l'autre.
# C'est ce mélange qui dicte la politique d'éviction, et c'est le point le plus
# important de ce fichier.
#
# Ce fichier est transformé en ConfigMap par le configMapGenerator de
# kustomization.yaml, qui suffixe le nom par un hash de son contenu : le
# modifier renomme la ConfigMap, ce qui déclenche automatiquement le
# redéploiement du StatefulSet. Sans ce mécanisme, un changement de maxmemory
# resterait sans effet jusqu'au prochain redémarrage fortuit du pod.
# ---------------------------------------------------------------------------

bind 0.0.0.0
port 6379

# Pas d'authentification : le contrôle d'accès est assuré par la NetworkPolicy,
# qui n'autorise que les pods api et worker du namespace `apps`. C'est un choix
# défendable sur un cluster mono-tenant, mais il repose entièrement sur le
# contrôleur de NetworkPolicy de K3s — s'il est désactivé, Redis devient
# joignable par tout le cluster.
protected-mode no

# ---------------------------------------------------------------------------
# Mémoire
# ---------------------------------------------------------------------------
# 256 Mo alors que le conteneur est limité à 384 Mo. Les 128 Mo d'écart ne sont
# pas du gaspillage : ils absorbent les tampons de réponse, la fragmentation de
# l'allocateur, et surtout le pic de copie-sur-écriture d'une réécriture AOF.
# Fixer maxmemory à la limite du conteneur revient à programmer un OOM kill au
# premier rewrite.
maxmemory 256mb

# volatile-lru et non allkeys-lru : c'est LA décision de ce fichier.
# allkeys-lru évincerait n'importe quelle clé sous pression mémoire, y compris
# les streams de la file — on perdrait des jobs silencieusement.
# volatile-lru ne touche qu'aux clés porteuses d'un TTL, c'est-à-dire au cache
# et aux sessions, que Laravel écrit toujours avec expiration. Les streams, eux,
# n'ont pas de TTL et sont donc intouchables.
# Contrepartie assumée : si l'éviction du cache ne suffit pas à libérer de la
# place, Redis répond par une erreur d'écriture plutôt que de perdre des jobs.
maxmemory-policy volatile-lru

# ---------------------------------------------------------------------------
# Persistance
# ---------------------------------------------------------------------------
# AOF activé : les jobs en file survivent à un redémarrage du pod.
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Snapshots RDB désactivés : avec l'AOF ils feraient double emploi, et chaque
# fork de sauvegarde coûte un pic mémoire dont on n'a pas la marge.
save ""

# ---------------------------------------------------------------------------
# Divers
# ---------------------------------------------------------------------------
# Les streams doivent être bornés côté application (XADD ... MAXLEN ~ N) : Redis
# ne le fait pas seul, et un stream non borné finit par remplir maxmemory sans
# jamais être éligible à l'éviction, pour la raison expliquée plus haut.
timeout 300
tcp-keepalive 300
loglevel notice
databases 2
