apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: data

resources:
  - statefulset.yaml
  - service.yaml
  - networkpolicy.yaml

# Le hash de contenu est conservé ici (contrairement aux secrets de PostgreSQL) :
# c'est lui qui provoque le redéploiement du StatefulSet quand redis.conf change.
configMapGenerator:
  - name: redis-config
    files:
      - redis.conf
