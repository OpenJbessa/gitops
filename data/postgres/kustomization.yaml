apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generators:
  - ./secret-generator.yaml

resources:
  - cluster.yaml
  - networkpolicy.yaml

# CloudNativePG référence les secrets par un nom fixe dans le Cluster : un
# suffixe de hash rendrait la référence invalide.
generatorOptions:
  disableNameSuffixHash: true
