# ---------------------------------------------------------------------------
# GABARIT — ce fichier n'est PAS déployé et ne contient aucun secret.
#
# Deux rôles, deux secrets :
#   postgres-app        rôle applicatif, propriétaire de la base `app` ;
#                       c'est celui qu'utilisent l'API et le worker.
#   postgres-superuser  superutilisateur, réservé aux opérations d'exploitation
#                       (extensions, diagnostic). Jamais dans une application.
#
# Le type `kubernetes.io/basic-auth` est imposé par CloudNativePG, qui lit les
# clés `username` et `password`.
#
# Procédure — le travail se fait EN PLACE sur le .enc.yaml, si bien qu'aucune
# copie en clair n'existe jamais sur le disque :
#
#   export EDITOR=nano                  # ou "code --wait"
#   # générer deux mots de passe distincts, alphanumériques uniquement :
#   #   openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 40
#   # (un '/' ou un '@' casserait les chaînes de connexion côté Laravel)
#   cd data/postgres
#   cp credentials.example.yaml credentials.enc.yaml
#   sops encrypt --in-place credentials.enc.yaml
#   sops edit credentials.enc.yaml
#
# NE PAS faire `sops --encrypt fichier.yaml > fichier.enc.yaml` : le path_regex
# de .sops.yaml ne reconnaît que *.enc.yaml, et SOPS applique ses règles au
# chemin du fichier d'ENTRÉE.
#
# Attention : ces mots de passe ne sont lus qu'à l'initialisation du cluster.
# Les changer ensuite dans le secret ne modifie pas le rôle dans PostgreSQL —
# il faut un ALTER ROLE. La rotation est décrite dans le README.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: postgres-app
  namespace: data
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: data
    app.kubernetes.io/managed-by: argocd
type: kubernetes.io/basic-auth
stringData:
  username: app
  password: REMPLACER_MOT_DE_PASSE_APPLICATIF
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-superuser
  namespace: data
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: data
    app.kubernetes.io/managed-by: argocd
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: REMPLACER_MOT_DE_PASSE_SUPERUTILISATEUR
