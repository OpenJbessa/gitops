# ---------------------------------------------------------------------------
# Grafana — visualisation authentifiée.
# Budget : 180 Mo de request, 256 Mo de limite.
# ---------------------------------------------------------------------------

replicas: 1

# 180 Mo au départ, ramenés à 128 après mesure : Grafana consomme 98 Mo en
# régime, sans tableau de bord lourd ni exploration interactive (désactivée
# plus bas). Les 52 Mo rendus financent l'opérateur Teleport et maintiennent la
# plateforme sous le plafond de 4 600 Mo.
resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    memory: 256Mi

# Aucun volume : les sources de données et les tableaux de bord sont
# provisionnés depuis ce dépôt à chaque démarrage. Grafana n'a donc aucun état
# à conserver, et un PVC ne ferait que permettre des modifications manuelles
# qui disparaîtraient au redéploiement suivant — c'est-à-dire de la dérive.
persistence:
  enabled: false

# La base SQLite interne vit dans un emptyDir. Elle ne contient que des
# préférences d'affichage, reconstruites au démarrage.
securityContext:
  runAsNonRoot: true
  runAsUser: 472
  runAsGroup: 472
  fsGroup: 472
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  # Grafana écrit sa base SQLite et ses fichiers temporaires hors volume :
  # la racine ne peut pas être en lecture seule. La policy Kyverno
  # correspondante ne vise que le namespace `apps`, précisément pour ce cas.
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/metrics"

serviceMonitor:
  enabled: false

# Le Job de test du chart déploie un pod supplémentaire à chaque synchronisation.
testFramework:
  enabled: false

# ---------------------------------------------------------------------------
# Accès
# ---------------------------------------------------------------------------
grafana.ini:
  server:
    root_url: https://grafana.jbessa.tech
  auth.anonymous:
    # Coupé. Le raisonnement précédent — « le rôle Viewer interdit toute
    # modification » — confondait lecture seule et surface réduite.
    #
    # Viewer porte la permission `datasources:query`, sans laquelle aucun
    # tableau de bord ne s'afficherait. Un visiteur anonyme pouvait donc poster
    # la PromQL de son choix sur /api/ds/query. Désactiver Explore plus bas
    # retire le bouton de l'interface, pas l'endpoint.
    #
    # Et c'était pire que la lecture. Le proxy de source de données,
    # /api/datasources/proxy/uid/victoriametrics/…, relaie vers l'API HTTP de
    # VictoriaMetrics. Grafana y refuse les POST hors requêtes, mais laisse
    # passer les GET — et VictoriaMetrics accepte un GET sur
    # /api/v1/admin/tsdb/delete_series. Éprouvé sur l'image 12.3.1 avec ce
    # grafana.ini rendu : série témoin présente, GET anonyme, réponse 204,
    # série disparue. N'importe qui sur Internet pouvait EFFACER les métriques.
    #
    # Avec l'anonyme coupé, les mêmes appels répondent 401.
    enabled: false
  auth:
    disable_login_form: false
  users:
    allow_sign_up: false
    allow_org_create: false
    viewers_can_edit: false
  analytics:
    reporting_enabled: false
    check_for_updates: false
  security:
    # Empêche l'intégration des tableaux de bord dans un site tiers, qui
    # permettrait de faire passer ces données pour celles d'un autre.
    allow_embedding: false
    cookie_secure: true
  log:
    mode: console
    level: warn
  # Laissé fermé, mais l'argument a changé : ce n'est plus une question de
  # surface publique — il n'y a plus de visiteur anonyme — seulement de coût.
  # Le tableau de bord provisionné a un profil de requêtes connu, l'exploration
  # ad hoc non, et VictoriaMetrics partage 2 vCPU avec tout le reste. À rouvrir
  # le jour où le besoin se présente vraiment.
  explore:
    enabled: false
  alerting:
    enabled: false
  unified_alerting:
    # Les alertes sont gérées par vmalert et Alertmanager. Le moteur intégré de
    # Grafana ferait doublon et consommerait de la mémoire pour rien.
    enabled: false

# Le mot de passe admin vient d'un secret SOPS de ce répertoire, et non plus
# d'une génération du chart. Tant que l'interface était anonyme, un mot de passe
# que seul le cluster connaissait suffisait : il ne servait qu'au dépannage.
# C'est désormais le seul identifiant d'accès, il doit donc être reproductible,
# détenu hors du cluster, et survivre à une reconstruction du namespace.
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

# ---------------------------------------------------------------------------
# Provisionnement
# ---------------------------------------------------------------------------
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        # uid fixe : c'est lui que référencent les panneaux du tableau de bord
        # JSON. Sans valeur explicite, Grafana en génère un aléatoire au premier
        # démarrage et tous les panneaux affichent « datasource not found ».
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://vmsingle.observability.svc.cluster.local:8428
        isDefault: true
        jsonData:
          # Doit correspondre au scrape_interval de vmagent, sinon Grafana
          # calcule des taux sur des fenêtres plus courtes que l'intervalle
          # réel et affiche des trous.
          timeInterval: 30s
          httpMethod: POST

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: gitops
        orgId: 1
        folder: Plateforme
        type: file
        # Non éditable et non supprimable : la seule façon de modifier un
        # tableau de bord est une pull request sur le JSON de ce dépôt.
        disableDeletion: true
        editable: false
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/gitops

# La ConfigMap est construite par kustomize à partir de
# observability/grafana/dashboards/*.json (cf. kustomization.yaml).
#
# Ce mécanisme plutôt que le sidecar du chart : le sidecar surveille l'API
# Kubernetes en permanence pour découvrir des ConfigMaps étiquetées, ce qui
# coûte un conteneur de plus — environ 50 Mo — pour un unique tableau de bord
# dont le nom est connu à l'avance.
dashboardsConfigMaps:
  gitops: grafana-dashboards

sidecar:
  dashboards:
    enabled: false
  datasources:
    enabled: false

# L'exposition passe par un IngressRoute Traefik, comme tout le reste.
ingress:
  enabled: false

service:
  type: ClusterIP
  port: 80
