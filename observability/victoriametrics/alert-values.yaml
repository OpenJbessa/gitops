# ---------------------------------------------------------------------------
# vmalert + Alertmanager.
# Budget : 64 Mo / 74 Mo pour vmalert (solde des 450 du trio VictoriaMetrics),
#          80 Mo / 128 Mo pour Alertmanager.
#
# Alertmanager est le sous-chart embarqué de victoria-metrics-alert plutôt
# qu'une Application distincte : les deux composants n'ont aucun sens l'un sans
# l'autre, et les coupler évite une Application et un cycle de réconciliation.
#
# Les règles sont déclarées ici, dans les valeurs, et non dans un ConfigMap
# séparé : le chart les écrit lui-même, et un ConfigMap externe imposerait de
# maintenir la correspondance de nom à la main.
# ---------------------------------------------------------------------------

server:
  fullnameOverride: vmalert
  replicaCount: 1

  datasource:
    url: http://vmsingle.observability.svc.cluster.local:8428

  # vmalert réécrit dans VictoriaMetrics l'état de ses règles (ALERTS,
  # ALERTS_FOR_STATE) : sans cela, un redémarrage de vmalert réarme toutes les
  # alertes en attente depuis zéro.
  remoteWrite:
    url: http://vmsingle.observability.svc.cluster.local:8428
  remoteRead:
    url: http://vmsingle.observability.svc.cluster.local:8428

  notifier:
    alertmanager:
      url: http://alertmanager.observability.svc.cluster.local:9093

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 74Mi

  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    enabled: true
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  podAnnotations:
    prometheus.io/scrape: "true"
    # 8880 et non 8080 : c'est le port réel du conteneur vmalert. La valeur
    # erronée laissait une cible en échec permanent côté vmagent, sans que rien
    # ne le signale ailleurs.
    prometheus.io/port: "8880"
    prometheus.io/path: "/metrics"

  # -------------------------------------------------------------------------
  # Règles d'alerte
  #
  # Cinq règles, pas une de plus. Sur une plateforme à un seul opérateur, une
  # alerte qu'on ignore est pire qu'une alerte absente : elle entraîne à
  # ignorer les autres.
  # -------------------------------------------------------------------------
  config:
    alerts:
      groups:
        - name: noeud
          interval: 1m
          rules:
            - alert: NoeudMemoireSaturee
              # Seuil absolu et non un ratio : joindre
              # node_memory_working_set_bytes (kubelet /metrics/resource) à
              # machine_memory_bytes (cAdvisor) suppose que les deux tâches de
              # collecte portent les mêmes étiquettes, ce qui est fragile. Un
              # VPS de 8 Go ne change pas de taille : 7 Go, c'est 87,5 %.
              # À REVOIR si le VPS est redimensionné.
              expr: node_memory_working_set_bytes > 7516192768
              for: 10m
              labels:
                severity: critical
              annotations:
                summary: "Le nœud dépasse 7 Go de mémoire utilisée"
                description: >-
                  {{ $value | humanize1024 }}o utilisés sur 8 Go. L'éviction de
                  pods est imminente, et elle frappera d'abord la charge la plus
                  gourmande — PostgreSQL.

        - name: charges
          interval: 1m
          rules:
            - alert: ConteneurProcheDeSaLimiteMemoire
              # Un conteneur qui passe 85 % de sa limite est à un pic près de
              # l'OOMKill. Sur ce cluster, l'OOMKill n'est pas visible en soi :
              # le pod redémarre, la sonde repasse au vert, et seul le compteur
              # kube_pod_container_status_restarts_total en garde la trace —
              # que personne ne regarde en temps réel. Cette alerte prévient
              # avant, pas après.
              #
              # RATIO ET NON SEUIL ABSOLU, contrairement à NoeudMemoireSaturee :
              # ici les deux séries portent déjà les mêmes étiquettes
              # d'identification (namespace, pod, container), la jointure est
              # donc sûre. C'est aussi la seule forme qui marche pour vingt
              # charges aux limites différentes, de 48 Mo pour nginx à 768 Mo
              # pour PostgreSQL.
              #
              # `container != ""` écarte les séries d'agrégat du pod entier, qui
              # n'ont pas de limite en face et produiraient une division par
              # une série absente. Le job cAdvisor les jette déjà
              # (metric_relabel_configs d'agent-values.yaml) : le filtre est ici
              # pour que la règle reste juste si ce filtre-là bouge.
              #
              # 10 minutes : assez pour ignorer le pic de démarrage de PHP-FPM
              # ou la synchronisation initiale du cache d'ArgoCD, tous deux
              # normaux et brefs. Une vraie dérive dure plus longtemps.
              expr: |-
                container_memory_working_set_bytes{container!=""}
                  / on (namespace, pod, container)
                  kube_pod_container_resource_limits{resource="memory"}
                  > 0.85
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.container }} ({{ $labels.pod }}) dépasse 85 % de sa limite mémoire"
                description: >-
                  {{ $value | humanizePercentage }} de la limite depuis
                  10 minutes. Le prochain pic donnera un OOMKill : le conteneur
                  redémarrera sans autre message que son compteur de
                  redémarrages. Relever la limite sort du budget mémoire —
                  vérifier d'abord s'il s'agit d'une fuite.

            - alert: PodEnCrashLoop
              expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} > 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "{{ $labels.namespace }}/{{ $labels.pod }} redémarre en boucle"
                description: >-
                  Conteneur {{ $labels.container }} en CrashLoopBackOff depuis
                  5 minutes.

        - name: certificats
          interval: 5m
          rules:
            - alert: CertificatBientotExpire
              # 15 jours : cert-manager renouvelle à 30 jours restants (cf.
              # renewBefore dans certificates.yaml). Déclencher à 15 laisse une
              # quinzaine de tentatives avant l'expiration réelle — le temps de
              # remarquer qu'un jeton Cloudflare a été révoqué.
              expr: (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400 < 15
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "Certificat {{ $labels.name }} expire dans moins de 15 jours"
                description: >-
                  Le renouvellement automatique n'a pas abouti. Vérifier le
                  jeton Cloudflare et les journaux de cert-manager.

        - name: stream
          interval: 1m
          rules:
            - alert: StreamRedisProcheDeSonPlafond
              # `demo_stream_lag`, publié par l'API, et non
              # `keda_scaler_metrics_value`. Les deux valent aujourd'hui la même
              # chose — le déclencheur est en `lagCount` — mais la seconde
              # change de SENS si le mode du scaler change un jour
              # (pendingEntriesCount et streamLength comptent autre chose sous
              # le même nom de métrique). Une alerte dont le seuil dépend d'un
              # réglage d'autoscaling est une alerte qui devient fausse en
              # silence. `demo_stream_lag` mesure le retard, point.
              #
              # Le seuil est l'approche de DEMO_STREAM_MAXLEN (10 000), pas la
              # saturation des consommateurs. Au-delà de MAXLEN, XADD supprime
              # des entrées NON LUES : Redis ne sait plus calculer le retard,
              # `demo_stream_lag` disparaît, et la courbe du front avec elle.
              # La perte est silencieuse, d'où une alerte avant et non après.
              #
              # 2 minutes et non 10 : à la vitesse de croissance d'une rafale
              # (100 entrées/s), 5 000 entrées de marge sont consommées en
              # moins d'une minute. Une fenêtre de 10 minutes préviendrait
              # après coup.
              expr: demo_stream_lag > 5000
              for: 2m
              labels:
                severity: warning
              annotations:
                summary: "Le stream demo:events approche de MAXLEN"
                description: >-
                  {{ $value }} entrées de retard depuis 2 minutes, sur un
                  MAXLEN de 10 000. Le plafond de 4 consommateurs est atteint et
                  ne peut pas être relevé sans sortir du budget mémoire. Au-delà
                  de MAXLEN, les entrées non lues sont supprimées sans trace.

        - name: base
          interval: 1m
          rules:
            - alert: PostgreSQLIndisponible
              # `absent_over_time` sur 10 minutes, et non `absent()` : ce dernier
              # déclenche dès qu'une seule évaluation ne voit pas la série, donc
              # au moindre redémarrage de pod — ou, comme au premier
              # déploiement, en permanence si la série n'a jamais existé faute
              # d'annotation de collecte sur les pods PostgreSQL.
              expr: cnpg_collector_up{namespace="data"} == 0 or absent_over_time(cnpg_collector_up{namespace="data"}[10m])
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "PostgreSQL ne répond plus"
                description: >-
                  Instance unique, sans réplique : l'API et le worker sont hors
                  service tant que ce pod n'est pas revenu.

# ---------------------------------------------------------------------------
# Alertmanager
# ---------------------------------------------------------------------------
alertmanager:
  enabled: true
  fullnameOverride: alertmanager
  replicaCount: 1
  mode: deployment

  # 5 jours d'historique : au-delà, une alerte résolue n'a plus d'intérêt.
  retention: 120h

  resources:
    requests:
      cpu: 10m
      memory: 80Mi
    limits:
      memory: 128Mi

  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    enabled: true
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9093"
    prometheus.io/path: "/metrics"

  # L'URL ntfy est un secret : sur le serveur public, connaître le nom du sujet
  # suffit à lire les alertes et à en publier de fausses. Elle est donc chiffrée
  # par SOPS (ntfy.enc.yaml) et montée en fichier, jamais écrite ici — ce dépôt
  # est public.
  extraVolumes:
    - name: ntfy
      secret:
        secretName: alertmanager-ntfy

  extraVolumeMounts:
    - name: ntfy
      mountPath: /etc/alertmanager/secrets
      readOnly: true

  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: defaut
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      # 4 heures avant de répéter : assez long pour ne pas harceler, assez
      # court pour qu'une alerte oubliée revienne le même jour.
      repeat_interval: 4h
      routes:
        - receiver: defaut
          matchers:
            - severity = "critical"
          repeat_interval: 1h

    receivers:
      - name: defaut
        webhook_configs:
          # `url_file` et non `url` : l'URL contient le nom du sujet ntfy, qui
          # tient lieu de mot de passe. Elle vient du secret chiffré monté
          # ci-dessus et ne transite jamais par Git.
          #
          # Le gabarit `alertmanager` intégré à ntfy est activé dans cette URL
          # (?template=alertmanager). Sans lui, la notification afficherait le
          # JSON brut d'Alertmanager, inexploitable sur un téléphone.
          - url_file: /etc/alertmanager/secrets/url
            send_resolved: true
            max_alerts: 10

    inhibit_rules:
      # Quand le nœud sature, tout tombe. Inutile de recevoir cinq alertes pour
      # une seule cause.
      - source_matchers:
          - alertname = "NoeudMemoireSaturee"
        target_matchers:
          - severity = "warning"
        equal: ["namespace"]
